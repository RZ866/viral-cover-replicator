<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src 'none'; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
:root{--paper:#f7f3ec;--card:#fffdf9;--ink:#292723;--muted:#6f6a61;--accent:#9b6545;--line:#ded5c8;--green:#52705b;--amber:#a87735;--red:#96584f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;line-height:1.72}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:24px}.nav{position:sticky;top:20px;align-self:start;background:#fffaf2;border:1px solid var(--line);border-radius:18px;padding:16px;max-height:calc(100vh - 40px);overflow:auto}.nav strong{display:block;margin:0 0 10px;color:var(--accent)}.nav a{display:block;color:var(--muted);text-decoration:none;padding:5px 8px;border-radius:8px;font-size:13px}.nav a:hover{background:#eee3d5;color:var(--ink)}main{min-width:0}.hero,.section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,42px);margin-bottom:22px;box-shadow:0 8px 30px rgba(74,58,38,.05)}.hero{min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,#efe2d2,#fffdf9 55%,#e7eee8)}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.14em;font-weight:700}.hero h1{font-size:clamp(34px,7vw,66px);line-height:1.06;margin:12px 0}.hero p{max-width:700px;color:var(--muted)}h2{font-size:clamp(24px,4vw,36px);line-height:1.2;margin:0 0 22px}h3{font-size:19px;margin:26px 0 10px}.section-no{color:var(--accent);font-size:12px;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}.card h3{margin-top:0}.claim{border-left:4px solid var(--line);padding:10px 12px;margin:10px 0;background:#faf7f1;border-radius:0 10px 10px 0}.claim.OBSERVATION{border-color:var(--green)}.claim.INFERENCE{border-color:var(--amber)}.claim.RECOMMENDATION{border-color:var(--accent)}.claim.UNKNOWN{border-color:var(--red)}.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-size:11px;margin-right:8px}.evidence{color:var(--muted);font-size:13px;margin-top:4px}.image{display:block;width:100%;max-height:760px;object-fit:contain;background:#eee7dc;border-radius:15px;border:1px solid var(--line)}.placeholder{min-height:220px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted);background:#faf7f1}.steps{counter-reset:step}.step{position:relative;padding:18px 18px 18px 54px;border-top:1px solid var(--line)}.step:before{counter-increment:step;content:counter(step);position:absolute;left:10px;top:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-weight:700}.diagram{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff;padding:8px}.diagram svg{display:block;width:100%;height:auto;min-width:360px}.list{margin:6px 0;padding-left:20px}.muted{color:var(--muted)}.empty{padding:24px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.plan{border-top:6px solid var(--accent)}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.comparison div{padding:12px;border-radius:10px;background:#faf7f1}.comparison b{display:block;color:var(--accent);font-size:12px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}.pill{display:inline-block;background:#eee3d5;border-radius:999px;padding:3px 10px;margin:3px;font-size:12px}@media(max-width:800px){.layout{display:block;padding:10px}.nav{position:relative;top:0;max-height:none;margin-bottom:14px}.nav div{display:flex;overflow:auto;gap:4px}.nav a{min-width:max-content}.hero,.section{border-radius:16px;padding:22px}.grid,.comparison{grid-template-columns:1fr}.hero{min-height:300px}}@media print{body{background:white}.layout{display:block;max-width:none;padding:0}.nav{display:none}.hero,.section{box-shadow:none;break-inside:avoid;border-color:#bbb;margin:0 0 14px}.section{break-before:auto}.diagram{overflow:visible}.footer{display:none}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<div class="layout">
<nav class="nav"><strong>拍摄指导报告</strong><div>{{NAV}}</div></nav>
<main>{{CONTENT}}<div class="footer">爆款封面复刻器 V1.0 · 本报告基于用户材料与视觉分析，不还原未知拍摄历史。</div></main>
</div>
</body>
</html>
